---
version: 0.0.1
slug: cups
name: CUPS Print Server
description: CUPS print server for network printing with a web interface
url: https://github.com/Greyhash-dev/cups-addon-webinterface
codenotary: me@gry.sh
arch:
  - aarch64
  - amd64
hassio_api: true
host_network: true
map:
  - data:rw
  - share:rw
init: false
usb: true
ports:
  631/tcp: 631
ports_description:
  631/tcp: CUPS web interface and printing port
options:
  admin_username: "admin"
  admin_password: "admin"
  printer_driver_deb: ""
schema:
  admin_username: str
  admin_password: password
  printer_driver_deb: str
startup: services
